# mkdocs.yml —— dsh-voice-mode 文档站（GitHub Pages，仅文档，不引入 CI）
# 部署：本地 `mkdocs build` 产出 site/，由人工或一次性 `mkdocs gh-deploy` 推送 gh-pages 分支
# 真源数字：v0.7.27 · 709 测试 · 兼容 dsh 0.2.1-rc.2（2026-10-21 刷新，R15-G 批落库后）
# docs_dir / site_dir（2026-10-21 修，导航不可达缺陷）：
#   本文件位于 docs/ 之下，而 mkdocs 的 docs_dir 默认值 'docs' 是**相对配置文件所在目录**解析的
#   → 默认取 docs/docs/（不存在，`mkdocs build` 直接报错）。旧配置未设 docs_dir，且 nav 混用两套口径：
#   4 条顶层条目（README.md / CONTEXT.md / glossary.md / compat-contract.md）是 docs_dir 相对、
#   36 条子目录条目（docs/adr/… / docs/plan/… / docs/qa/… / docs/rules/… / docs/competitive/… /
#   docs/findings/… / docs/review-2026-10-19-full-audit.md）是仓库根相对。
#   → docs_dir=docs/ 时 36 条解析到不存在的 docs/docs/…；docs_dir=仓库根 时 4 条顶层解析到根级文件
#   （且 docs_dir=仓库根 会把整仓（含 lib/ 与 node_modules/）纳入站点源目录）。
#   **不存在任何单一 docs_dir 能让 40 条同时解析**（影响：导航丢失 6 个分区 = 架构决策/实施计划/
#   真机验收/规则/竞品/发现）。
#   修法（口径统一）：显式设 `docs_dir: .`（= <repo>/docs/），并把 36 条子目录条目**去掉 docs/ 前缀**，
#   使全部 40 条统一以 docs/ 为根 → 40 条全部可解析、6 个分区恢复可达。
#   site_dir 显式设 ../site：产物留在仓库根（与本文件头部「mkdocs build 产出 site/」的描述一致），
#   避免把 site/ 写进 docs_dir 自身。
docs_dir: .
site_dir: ../site
site_name: dsh-voice-mode
site_description: DeepSeek Harness 全双工语音插件文档 —— 边说边出字 · 按句朗读 · 开口即打断
site_author: qishuilalala
site_url: https://qishuilalala.github.io/dsh-voice-mode/
repo_url: https://github.com/qishuilalala/dsh-voice-mode
repo_name: qishuilalala/dsh-voice-mode
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 dsh-voice-mode contributors · MIT License

theme:
  name: material
  language: zh
  # GitHub 深色风，与 social preview 配色一致（#0d1117 / #2ea043 / #58a6ff）
  palette:
    scheme: slate
    primary: green
    accent: light blue
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.highlight

nav:
  - 首页: README.md
  - 项目上下文: CONTEXT.md
  - 词汇表: glossary.md
  - 兼容契约: compat-contract.md
  - 架构决策:
      - adr/README.md
      - adr/0001-native-aec-primary.md
      - adr/0002-dual-version-compat.md
      - adr/0003-server-side-vad.md
      - adr/0004-realtime-transport-deferred.md
      - adr/0005-acoustic-regression-harness.md
      - adr/0006-barge-in-auto-degrade.md
      - adr/0007-emotion-tag-dsl.md
      - adr/0008-yield-semantics.md
      - adr/0009-plugin-settings-self-persistence.md
      - adr/0010-i18n-official-locale.md
      - adr/0011-bundle-msedge-tts-inline.md
      - adr/0012-barge-in-salvage.md
  - 实施计划:
      - plan/README.md
      - plan/implementation-plan-2026-09-14.md
      - plan/beautification-plan-2026-09-16.md
  - 真机验收:
      - qa/README.md
      - qa/real-machine-acceptance-checklist.md
      - qa/must-verify-manually.md
      - review-2026-10-19-full-audit.md
  - 规则:
      - rules/README.md
      - rules/STATE.md
  - 竞品:
      - competitive/README.md
      - competitive/competitive-tts-landscape-2026-05.md
      - competitive/scan-2026-09.md
      - competitive/round6-summary.md
      - competitive/backlog.md
  - 发现:
      - findings/README.md
      - findings/2026-09-02-barge-in-latency-stall.md
      - findings/2026-09-02-echo-gate-ratchet.md
      - findings/2026-09-14-fixture-verdict.md
      - findings/2026-09-15-sleeping-capabilities-audit.md
      - findings/2026-09-15-yield-semantics-research.md
      - findings/baseline-review-p0-a1-a10.md
      - findings/dsh-llm-runtime-inventory-2026-09.md
      - findings/multilang-a11y-compliance-baseline.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search:
      lang: zh
